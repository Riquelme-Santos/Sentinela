<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Alta Hospitalar - Sentinela</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f7fa;
        color: #1f2937;
    }

    .container {
        width: 90%;
        max-width: 700px;
        margin: 50px auto;
    }

    .card {
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
        color: #0f766e;
        margin-bottom: 10px;
    }

    .descricao {
        color: #64748b;
        margin-bottom: 30px;
    }

    .campo {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #334155;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        font-family: Arial, sans-serif;
        outline: none;
    }

    input:focus,
    textarea:focus {
        border-color: #0f766e;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    .botao-container {
        display: flex;
        justify-content: flex-end;
        margin-top: 25px;
    }

    button {
        background-color: #0f766e;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #115e59;
    }

    .mensagem {
        display: none;
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background-color: #dcfce7;
        color: #166534;
    }

    @media print {

        @page {
            size: A4;
            margin: 20mm;
        }

        body {
            background: white;
        }

        .container {
            width: 100%;
            margin: 0;
        }

        .card {
            box-shadow: none;
            padding: 0;
        }

        .botao-container,
        .mensagem {
            display: none;
        }
    }
</style>

</head> <body>
<main class="container">

    <section class="card">

        <h1>Alta Hospitalar</h1>

        <p class="descricao">
            Preencha os dados para registrar a alta do paciente.
        </p>

        <div class="campo">
            <label for="nomePaciente">
                Nome do paciente
            </label>

            <input
                type="text"
                id="nomePaciente"
                placeholder="Digite o nome do paciente"
            >
        </div>

        <div class="campo">
            <label for="medicacoes">
                Medicações
            </label>

            <textarea
                id="medicacoes"
                placeholder="Digite as medicações do paciente..."
            ></textarea>
        </div>

        <div class="campo">
            <label for="observacoes">
                Observações
            </label>

            <textarea
                id="observacoes"
                placeholder="Digite as observações..."
            ></textarea>
        </div>

        <div class="botao-container">

            <button
                type="button"
                onclick="finalizarAlta()"
            >
                Finalizar Alta
            </button>

        </div>

        <div
            id="mensagem"
            class="mensagem"
        >
            Alta hospitalar finalizada com sucesso!
        </div>

    </section>

</main>

<script>
    function finalizarAlta() {

        const nome =
            document.getElementById("nomePaciente").value.trim();

        if (nome === "") {
            alert("Digite o nome do paciente.");
            return;
        }

        document.getElementById("mensagem").style.display = "block";

        window.print();
    }
</script>

</body> </html>

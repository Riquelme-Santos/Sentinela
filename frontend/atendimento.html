<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/atendimento.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="data de nascimento" placeholder="Data de nascimento">
<input id="dexo" placeholder="Sexo">
<input id="nome da mae" placeholder="Nome da Mãe">
<input id="estado civil" placeholder="Estado civil">
<input id="endereco" placeholder="Endereço">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="E-mail">
<input id="contato de emergencia" placeholder="Contato de emergência">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    tipo: tipo.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinela — Chamada de Pacientes</title>

  <style>
    /* ========================================
       SENTINELA — TV DE CHAMADAS
       Identidade visual baseada nas outras
       páginas do projeto
       ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #176b70;
      --primary-light: #29958b;
      --primary-dark: #12585d;

      --background: #eaf6f5;
      --background-light: #f8fbfb;

      --text: #294547;
      --text-light: #84999a;

      --white: #ffffff;
      --border: #dcebea;

      --success: #238f83;
      --success-light: #e1f1ef;

      --shadow: rgba(30, 70, 70, 0.10);
    }

    body {
      min-height: 100vh;

      font-family: "Segoe UI", Roboto, Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #eaf6f5 0%,
          #f8fbfb 50%,
          #e8f2f5 100%
        );

      color: var(--text);

      overflow: hidden;
      position: relative;
    }

    /* ========================================
       DECORAÇÃO DO FUNDO
       ======================================== */

    body::before {
      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background: rgba(38, 143, 134, 0.07);

      top: -230px;
      left: -180px;

      z-index: -1;
    }

    body::after {
      content: "";

      position: fixed;

      width: 450px;
      height: 450px;

      border-radius: 50%;

      background: rgba(23, 107, 112, 0.06);

      right: -180px;
      bottom: -200px;

      z-index: -1;
    }

    /* ========================================
       CONTAINER PRINCIPAL
       ======================================== */

    .tv-container {
      width: 94vw;
      height: 88vh;

      display: grid;

      grid-template-columns: 34% 66%;

      gap: 18px;
    }

    .left-panel,
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;

      min-width: 0;
    }

    /* ========================================
       CARDS
       ======================================== */

    .box {
      position: relative;

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 28px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      box-shadow:
        0 20px 50px var(--shadow),
        0 4px 12px rgba(30, 70, 70, 0.05);

      overflow: hidden;
    }

    /* Linha decorativa no topo dos cards */

    .box::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 4px;

      background: linear-gradient(
        90deg,
        var(--primary),
        var(--primary-light)
      );
    }

    /* ========================================
       TÍTULOS
       ======================================== */

    .box-title {
      color: var(--primary);

      font-size: clamp(18px, 2vw, 30px);

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.8px;

      margin-bottom: 15px;
    }

    /* ========================================
       PAINEL DO LOCAL
       ======================================== */

    .local-box {
      flex: 1;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f5fbfa
        );
    }

    .local-box .box-title {
      font-size: clamp(18px, 1.8vw, 28px);
    }

    .local-number {
      color: var(--primary);

      font-size: clamp(70px, 8vw, 150px);

      font-weight: 800;

      line-height: 0.95;

      letter-spacing: -3px;

      margin-top: 5px;
    }

    .local-type {
      color: var(--text-light);

      font-size: clamp(16px, 1.5vw, 24px);

      font-weight: 600;

      margin-top: 12px;
    }

    /* ========================================
       HISTÓRICO
       ======================================== */

    .history-box {
      flex: 1;

      justify-content: flex-start;
      align-items: stretch;

      text-align: left;
    }

    .history-box .box-title {
      align-self: center;

      font-size: clamp(17px, 1.7vw, 25px);

      margin-bottom: 20px;
    }

    #history-list {
      list-style: none;

      width: 100%;

      color: var(--text);

      font-size: clamp(15px, 1.35vw, 22px);

      font-weight: 600;

      text-align: left;
    }

    #history-list li {
      display: flex;
      align-items: center;

      min-height: 48px;

      margin-bottom: 10px;

      padding: 10px 14px;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: #f9fcfc;

      color: var(--text);

      transition: 0.2s ease;
    }

    #history-list li::before {
      content: "";

      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--primary-light);

      margin-right: 10px;
    }

    #history-list li:last-child {
      margin-bottom: 0;
    }

    /* ========================================
       PAINEL DO PACIENTE
       ======================================== */

    .patient-box {
      flex: 3;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #f4faf9 100%
        );
    }

    .patient-box .box-title {
      font-size: clamp(20px, 2.1vw, 32px);

      margin-bottom: 20px;
    }

    .patient-name {
      width: 100%;

      color: var(--primary);

      font-size: clamp(45px, 6vw, 105px);

      font-weight: 800;

      line-height: 1.05;

      letter-spacing: -2px;

      word-break: break-word;

      overflow-wrap: anywhere;

      text-shadow:
        0 2px 8px rgba(23, 107, 112, 0.08);
    }

    /* ========================================
       INDICADOR DE CHAMADA
       ======================================== */

    .patient-box::after {
      content: "CHAMADA ATUAL";

      position: absolute;

      top: 22px;
      right: 24px;

      padding: 6px 12px;

      border-radius: 20px;

      background: var(--success-light);

      color: var(--primary);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.8px;
    }

    /* ========================================
       LOGO / RODAPÉ
       ======================================== */

    .logo-box {
      flex: 1;

      flex-direction: row;

      justify-content: center;

      gap: 15px;

      background: #ffffff;
    }

    .logo-icon {
      width: 55px;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: var(--success-light);

      color: var(--primary);

      font-size: 30px;
    }

    .logo-content {
      text-align: left;
    }

    .logo-text {
      color: var(--primary);

      font-size: clamp(24px, 3vw, 44px);

      font-weight: 700;

      line-height: 1;
    }

    .logo-subtitle {
      margin-top: 5px;

      color: var(--text-light);

      font-size: clamp(12px, 1.1vw, 17px);

      font-weight: 500;

      letter-spacing: 0.4px;
    }

    /* ========================================
       ANIMAÇÃO DE NOVA CHAMADA
       ======================================== */

    @keyframes flash {
      0% {
        transform: scale(1);
        box-shadow:
          0 20px 50px var(--shadow),
          0 4px 12px rgba(30, 70, 70, 0.05);
      }

      25% {
        transform: scale(1.015);
        box-shadow:
          0 0 0 8px rgba(41, 149, 139, 0.14),
          0 20px 60px rgba(35, 143, 131, 0.18);
      }

      50% {
        transform: scale(1);
        box-shadow:
          0 0 0 4px rgba(41, 149, 139, 0.08),
          0 20px 60px rgba(35, 143, 131, 0.12);
      }

      75% {
        transform: scale(1.01);
        box-shadow:
          0 0 0 7px rgba(41, 149, 139, 0.12),
          0 20px 60px rgba(35, 143, 131, 0.16);
      }

      100% {
        transform: scale(1);
        box-shadow:
          0 20px 50px var(--shadow),
          0 4px 12px rgba(30, 70, 70, 0.05);
      }
    }

    .flash {
      animation: flash 0.6s ease 3;
    }

    /* ========================================
       RESPONSIVIDADE
       ======================================== */

    @media (max-width: 900px) {
      .tv-container {
        width: 94vw;
        height: 92vh;

        grid-template-columns: 1fr;

        overflow-y: auto;
      }

      body {
        overflow: auto;
      }

      .left-panel,
      .right-panel {
        width: 100%;
      }

      .local-box {
        min-height: 260px;
      }

      .patient-box {
        min-height: 400px;
      }

      .logo-box {
        min-height: 130px;
      }
    }

    @media (max-width: 600px) {
      .tv-container {
        width: 92vw;

        gap: 12px;
      }

      .left-panel,
      .right-panel {
        gap: 12px;
      }

      .box {
        padding: 22px 18px;

        border-radius: 14px;
      }

      .patient-box::after {
        display: none;
      }

      .patient-name {
        font-size: 42px;
      }

      .local-number {
        font-size: 75px;
      }

      .logo-icon {
        width: 45px;
        height: 45px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================
       TELA DA TV
       ======================================== -->

  <div class="tv-container">

    <!-- PAINEL ESQUERDO -->
    <div class="left-panel">

      <!-- LOCAL -->
      <div class="box local-box">

        <div class="box-title" id="local-tipo">
          GUICHÊ
        </div>

        <div class="local-number" id="local-numero">
          --
        </div>

        <div class="local-type">
          Local de atendimento
        </div>

      </div>

      <!-- HISTÓRICO -->
      <div class="box history-box">

        <div class="box-title">
          Últimas chamadas
        </div>

        <ul id="history-list"></ul>

      </div>

    </div>


    <!-- PAINEL DIREITO -->
    <div class="right-panel">

      <!-- PACIENTE -->
      <div class="box patient-box">

        <div class="box-title">
          Paciente
        </div>

        <div class="patient-name" id="patient-name">
          AGUARDANDO...
        </div>

      </div>


      <!-- IDENTIDADE -->
      <div class="box logo-box">

        <div class="logo-icon">
          🏥
        </div>

        <div class="logo-content">

          <div class="logo-text">
            Sentinela
          </div>

          <div class="logo-subtitle">
            Sistema de atendimento hospitalar
          </div>

        </div>

      </div>

    </div>

  </div>


  <script>
    let ultimoId = null;

    // Busca a chamada atual e o histórico da TV em tempo real.
    function atualizar() {

      fetch("/tv/chamada")

        .then(r => r.json())

        .then(data => {

          const chamada = data.chamada;
          const historico = data.historico || [];

          if (chamada) {

            document.getElementById("local-tipo").innerText =
              chamada.localTipo || "GUICHÊ";

            document.getElementById("local-numero").innerText =
              chamada.localNumero || "--";

            document.getElementById("patient-name").innerText =
              chamada.paciente || "AGUARDANDO...";


            // Flash visual quando há uma chamada nova.
            if (chamada.id !== ultimoId) {

              ultimoId = chamada.id;

              const patientBox =
                document.querySelector(".patient-box");

              patientBox.classList.remove("flash");

              void patientBox.offsetWidth;

              patientBox.classList.add("flash");
            }
          }


          // Histórico.
          const list =
            document.getElementById("history-list");

          list.innerHTML = "";

          historico.slice(0, 4).forEach(h => {

            const li =
              document.createElement("li");

            const tipo =
              h.localTipo
                ? h.localTipo.substring(0, 4)
                : "GUIC";

            li.innerText =
              `${tipo}. ${h.localNumero} - ${h.paciente}`;

            list.appendChild(li);
          });

        })

        .catch(err =>
          console.log(
            "Erro ao buscar chamada:",
            err
          )
        );
    }


    // Primeira atualização.
    atualizar();

    // Atualização a cada 2 segundos.
    setInterval(atualizar, 2000);
  </script>

</body>
</html>
